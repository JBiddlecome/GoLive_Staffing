services:
  - type: web
    runtime: python            # use runtime, not env
    name: golive-staffing-tools
    region: oregon
    plan: starter

    disk:
      name: golive-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION    # <- this is how you pin Python in a Blueprint
        value: "3.12.6"
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: DATA_DIR
        value: /var/data
      # optional: set this only if you want the Streamlit path by default
      # - key: APP_TYPE
      #   value: "streamlit"

    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --cache-dir /opt/render/.cache/pip -r requirements.txt

    startCommand: ./scripts/render_start.sh

    autoDeploy: true
    healthCheckPath: /healthz

{% extends "base.html" %}

{% block title %}Login — GoLive Staffing{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
    <div>
      <!-- Optional: Include logo here if available -->
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
        GoLive Staffing
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Please sign in with your company email
      </p>
    </div>
    <form class="mt-8 space-y-6" action="/auth/login" method="POST">
      <input type="hidden" name="next" value="{{ next }}">
      
      {% if error %}
      <div class="rounded-md bg-red-50 p-4 border border-red-200">
        <div class="flex">
          <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800">{{ error }}</h3>
          </div>
        </div>
      </div>
      {% endif %}

      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="email-address" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required 
                 class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 focus:z-10 sm:text-sm" 
                 placeholder="your.name@golivestaffing.com">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required 
                 class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 focus:z-10 sm:text-sm" 
                 placeholder="••••••••">
        </div>
      </div>

      <div>
        <button type="submit" 
                class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors duration-200 shadow-sm">
          Sign in
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

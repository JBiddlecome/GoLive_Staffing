<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}GoLive Staffing — Tools{% endblock %}</title>
  <meta name="description" content="Internal GoLive! Staffing tools."/>
  <link rel="icon" href="/static/favicon.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fallback {
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
    }
    .brand-serif {
      font-family: "Playfair Display", "Times New Roman", serif;
    }
    body {
      background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(74, 222, 128, 0.12), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(16, 185, 129, 0.1), transparent 30%),
        #f9fbf8;
    }
    .page-loader {
      z-index: 50;
    }
    .page-loader-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: rgba(16, 185, 129, 0.9);
      border-radius: 9999px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body class="fallback text-gray-900">
  <header class="w-full bg-white/70 backdrop-blur border-b">
    <div class="max-w-screen-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <img src="/static/logo.svg" alt="GoLive Staffing logo" class="h-12 w-auto" />
        <span class="text-lg font-semibold">GoLive Staffing — Tools</span>
      </a>
      <nav class="space-x-4 text-sm">
        <a class="hover:underline" href="/contacts">Contacts</a>
        <a class="hover:underline" href="/concierge">Concierge</a>
        <a class="hover:underline" href="/interview-questions">Interview Questions</a>
        <a class="hover:underline" href="/external-ai-tools">External AI Tools</a>
      </nav>
    </div>
  </header>

  <main class="max-w-screen-2xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-screen-2xl mx-auto px-4 py-8 text-xs text-gray-500">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
      <span>© {{ 2025 }} GoLive! Staffing — Internal tools</span>
      {% block footer_links %}{% endblock %}
    </div>
  </footer>
  <div
    id="page-loader"
    class="page-loader hidden fixed inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center"
    role="status"
    aria-live="polite"
  >
    <div class="flex flex-col items-center gap-4 text-emerald-700">
      <div class="page-loader-spinner" aria-hidden="true"></div>
      <span class="text-sm font-semibold tracking-wide">Loading...</span>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('page-loader');
      if (!loader) return;

      const links = document.querySelectorAll('a[href]');
      links.forEach((link) => {
        const href = link.getAttribute('href') || '';
        if (
          href.startsWith('#') ||
          href.startsWith('mailto:') ||
          href.startsWith('tel:') ||
          (link.target && link.target !== '_self')
        ) {
          return;
        }
        link.addEventListener('click', () => {
          loader.classList.remove('hidden');
        });
      });

      window.addEventListener('pageshow', () => {
        loader.classList.add('hidden');
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

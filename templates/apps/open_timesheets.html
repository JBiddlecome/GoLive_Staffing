<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Timesheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #059669;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .table-container {
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        
        th {
            background-color: #f3f4f6;
            color: #374151;
            font-weight: 600;
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }
        
        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            color: #4b5563;
        }
        
        tr:hover td {
            background-color: #f9fafb;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center text-gray-700 hover:text-emerald-600 transition-colors">
                        <i class="fa-solid fa-arrow-left mr-2"></i>
                        <span class="font-medium">Back to Tools</span>
                    </a>
                </div>
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-900">Open Timesheets</h1>
                </div>
                <div class="flex items-center w-24">
                    <!-- Placeholder for balance -->
                </div>
            </div>
        </div>
    </nav>

    <main class="w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Controls Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8 flex flex-col sm:flex-row items-end sm:items-center justify-between gap-4">
            <form id="filter-form" class="flex flex-col sm:flex-row items-end gap-4 w-full sm:w-auto">
                <div>
                    <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                    <input type="date" id="start_date" name="start_date" value="{{ start_date }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm border px-3 py-2">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                    <input type="date" id="end_date" name="end_date" value="{{ end_date }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm border px-3 py-2">
                </div>
                <div>
                    <label for="coordinator_filter" class="block text-sm font-medium text-gray-700 mb-1">Coordinator</label>
                    <select id="coordinator_filter" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm border px-3 py-2 bg-white">
                        <option value="All">All Coordinators</option>
                    </select>
                </div>
                <button type="submit" 
                    class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 h-[38px] items-center transition-colors">
                    Filter
                </button>
            </form>
            
            <!-- Additional quick filters if needed -->
            <div class="flex flex-col sm:flex-row items-end sm:items-center gap-4">
                <div class="flex items-center">
                    <input id="hide_started" name="hide_started" type="checkbox" class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded">
                    <label for="hide_started" class="ml-2 block text-sm text-gray-900">
                        Hide started timesheets
                    </label>
                </div>
                <div class="text-sm text-gray-500">
                    <span id="record-count">0</span> timesheets found
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex justify-center items-center py-12 hidden">
            <div class="spinner"></div>
        </div>

        <!-- Error State -->
        <div id="error-message" class="bg-red-50 border-l-4 border-red-400 p-4 mb-8 hidden">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fa-solid fa-circle-exclamation text-red-400"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700" id="error-text"></p>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="table-container">
            <div class="overflow-x-auto">
                <table id="data-table" class="hidden">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Employee Name</th>
                            <th>Client</th>
                            <th>Link</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Break Start</th>
                            <th>Break End</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden bg-white p-12 text-center rounded-xl shadow-sm border border-gray-200">
            <i class="fa-regular fa-calendar-check text-4xl text-gray-300 mb-4"></i>
            <h3 class="text-lg font-medium text-gray-900">No open timesheets</h3>
            <p class="text-gray-500 mt-1">There are no open timesheets for the selected date range.</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('filter-form');
            const table = document.getElementById('data-table');
            const tableBody = document.getElementById('table-body');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const recordCount = document.getElementById('record-count');
            const coordinatorFilter = document.getElementById('coordinator_filter');
            const hideStartedFilter = document.getElementById('hide_started');

            let allData = [];

            const fetchData = async (startDate, endDate) => {
                // Show loading
                loading.classList.remove('hidden');
                table.classList.add('hidden');
                emptyState.classList.add('hidden');
                errorMessage.classList.add('hidden');
                
                try {
                    const response = await fetch(`/open-timesheets/data?start_date=${startDate}&end_date=${endDate}`);
                    
                    if (!response.ok) {
                        throw new Error(`Error: ${response.statusText}`);
                    }
                    
                    const result = await response.json();
                    
                    if (result.error) {
                        throw new Error(result.error);
                    }
                    
                    allData = result.data;
                    populateCoordinators(allData);
                    filterAndRenderTable();
                } catch (error) {
                    errorMessage.classList.remove('hidden');
                    errorText.textContent = error.message;
                    recordCount.textContent = '0';
                } finally {
                    loading.classList.add('hidden');
                }
            };

            const populateCoordinators = (data) => {
                const currentValue = coordinatorFilter.value;
                const uniqueCoords = [...new Set(data.map(item => item.staffing_coordinator))].sort();
                
                coordinatorFilter.innerHTML = '<option value="All">All Coordinators</option>';
                uniqueCoords.forEach(coord => {
                    if (!coord) return;
                    const option = document.createElement('option');
                    option.value = coord;
                    option.textContent = coord;
                    coordinatorFilter.appendChild(option);
                });
                
                if (uniqueCoords.includes(currentValue)) {
                    coordinatorFilter.value = currentValue;
                }
            };

            const filterAndRenderTable = () => {
                const selectedCoord = coordinatorFilter.value;
                const hideStarted = hideStartedFilter.checked;
                let filteredData = allData;
                
                if (selectedCoord !== "All") {
                    filteredData = filteredData.filter(item => item.staffing_coordinator === selectedCoord);
                }
                
                if (hideStarted) {
                    filteredData = filteredData.filter(item => !item.employee_start);
                }
                
                renderTable(filteredData);
            };

            coordinatorFilter.addEventListener('change', filterAndRenderTable);
            hideStartedFilter.addEventListener('change', filterAndRenderTable);

            const renderTable = (data) => {
                recordCount.textContent = data.length;
                tableBody.innerHTML = '';
                
                if (data.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    
                    const timeCell = (val) => {
                        if (!val) return '<span class="text-gray-400 italic">Empty</span>';
                        // Extract time part from datetime
                        const parts = val.split(' ');
                        return parts.length > 1 ? parts[1] : val;
                    };
                    
                    let startDisplay = timeCell(item.employee_start);
                    
                    if (item.minutes_late !== "") {
                        const shiftStartStr = timeCell(item.shift_start);
                        let lateClass = "text-emerald-600";
                        let lateText = "On time";
                        
                        if (item.minutes_late > 0) {
                            lateClass = "text-red-600 font-semibold";
                            lateText = `${item.minutes_late}m late`;
                        } else if (item.minutes_late < 0) {
                            lateClass = "text-emerald-600";
                            lateText = `${Math.abs(item.minutes_late)}m early`;
                        }
                        
                        startDisplay = `
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-500 mb-0.5">Shift: ${shiftStartStr}</span>
                                <span>${timeCell(item.employee_start)}</span>
                                <span class="text-xs ${lateClass} mt-0.5">${lateText}</span>
                            </div>
                        `;
                    }
                    
                    tr.innerHTML = `
                        <td class="whitespace-nowrap font-medium text-gray-900">${item.event_date}</td>
                        <td class="whitespace-nowrap">
                            <div class="font-medium text-gray-900">${item.employee_name}</div>
                            <div class="text-xs text-gray-500">${item.employee_phone}</div>
                        </td>
                        <td class="whitespace-nowrap">
                            <div class="font-medium text-gray-900">${item.client_name}</div>
                            <div class="text-xs text-gray-500">${item.staffing_coordinator}</div>
                        </td>
                        <td class="whitespace-nowrap">
                            <a href="${item.timesheet_link}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline">
                                View Timesheet <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                            </a>
                        </td>
                        <td class="whitespace-nowrap">${startDisplay}</td>
                        <td class="whitespace-nowrap">${timeCell(item.employee_end)}</td>
                        <td class="whitespace-nowrap">${timeCell(item.employee_break_start)}</td>
                        <td class="whitespace-nowrap">${timeCell(item.employee_break_end)}</td>
                    `;
                    tableBody.appendChild(tr);
                });
                
                table.classList.remove('hidden');
            };

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const startDate = document.getElementById('start_date').value;
                const endDate = document.getElementById('end_date').value;
                fetchData(startDate, endDate);
            });

            // Initial fetch
            const initialStart = document.getElementById('start_date').value;
            const initialEnd = document.getElementById('end_date').value;
            fetchData(initialStart, initialEnd);
        });
    </script>
</body>
</html>
